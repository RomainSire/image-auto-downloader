appId: com.romain.image-auto-downloader
productName: Image Auto Downloader
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{DEV_PLAN.md,.claude/**/*}'
asarUnpack:
  - resources/**
win:
  executableName: image-auto-downloader
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  target:
    - dmg
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Pas de compte Apple Developer → build non signé / non notarisé.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/icon.png
  category: Utility
  maintainer: Romain <rsire@tuta.io>
  target:
    - AppImage
    - deb
    - rpm
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
