<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Auto Downloader</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />

    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div id="app">
      <header class="app-header">
        <h1 class="app-title">Image Auto Downloader</h1>
        <p class="app-subtitle">B-roll libre de droit — Unsplash · Pexels · Pixabay · Openverse</p>
      </header>

      <main class="app-main">
        <section class="card">
          <h2 class="card-title">Coquille prête</h2>
          <p class="card-text">
            L'interface de téléchargement sera construite dans les prochaines phases.
          </p>
          <p class="status" id="apiStatus">Vérification de l'API…</p>
        </section>
      </main>

      <footer class="app-footer">
        <ul class="versions">
          <li class="electron-version"></li>
          <li class="chrome-version"></li>
          <li class="node-version"></li>
        </ul>
      </footer>
    </div>

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
