<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Auto Downloader</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />

    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div id="app">
      <header class="app-header">
        <h1 class="app-title">Image Auto Downloader</h1>
        <p class="app-subtitle">B-roll libre de droit — Unsplash · Pexels · Pixabay · Openverse</p>
        <button class="btn-secondary header-settings" id="openSettings" type="button">
          ⚙ Réglages
        </button>
      </header>

      <main class="app-main">
        <section class="card">
          <p class="status" id="apiStatus">Chargement de la configuration…</p>

          <div class="form-row">
            <label class="field">
              <span class="field-label">Recherche (mot-clé)</span>
              <input
                class="field-input"
                id="keyword"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="ex. ramen, tokyo night, hands cooking…"
              />
            </label>
          </div>

          <div class="form-row form-row-split">
            <label class="field field-grow">
              <span class="field-label">Dossier de destination</span>
              <input
                class="field-input"
                id="destFolder"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="D:\BRoll"
              />
            </label>
            <label class="field field-grow">
              <span class="field-label">Sous-dossier</span>
              <input
                class="field-input"
                id="subFolder"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="2026-06-04-ramen"
              />
            </label>
          </div>

          <div class="sources">
            <div class="source-block" data-source="unsplash">
              <label class="source-toggle">
                <input class="source-enabled" type="checkbox" checked />
                <span class="source-name">Unsplash</span>
              </label>
              <label class="source-count-field">
                <span class="source-count-label">Nombre</span>
                <input class="source-count" type="number" min="1" value="10" />
              </label>
              <span class="source-progress" data-state="idle">—</span>
              <p class="source-error" hidden></p>
            </div>

            <div class="source-block" data-source="pexels">
              <label class="source-toggle">
                <input class="source-enabled" type="checkbox" checked />
                <span class="source-name">Pexels</span>
              </label>
              <label class="source-count-field">
                <span class="source-count-label">Nombre</span>
                <input class="source-count" type="number" min="1" value="10" />
              </label>
              <span class="source-progress" data-state="idle">—</span>
              <p class="source-error" hidden></p>
            </div>

            <div class="source-block" data-source="pixabay">
              <label class="source-toggle">
                <input class="source-enabled" type="checkbox" checked />
                <span class="source-name">Pixabay</span>
              </label>
              <label class="source-count-field">
                <span class="source-count-label">Nombre</span>
                <input class="source-count" type="number" min="1" value="10" />
              </label>
              <span class="source-progress" data-state="idle">—</span>
              <p class="source-error" hidden></p>
            </div>

            <div class="source-block" data-source="openverse">
              <label class="source-toggle">
                <input class="source-enabled" type="checkbox" checked />
                <span class="source-name">Openverse</span>
              </label>
              <label class="source-count-field">
                <span class="source-count-label">Nombre</span>
                <input class="source-count" type="number" min="1" value="10" />
              </label>
              <span class="source-progress" data-state="idle">—</span>
              <p class="source-error" hidden></p>
            </div>
          </div>

          <div class="download-bar">
            <button class="btn-primary" id="downloadBtn" type="button">Télécharger</button>
            <span class="download-status" id="downloadStatus"></span>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <ul class="versions">
          <li class="electron-version"></li>
          <li class="chrome-version"></li>
          <li class="node-version"></li>
        </ul>
      </footer>
    </div>

    <!-- Panneau Réglages (overlay). Ouvert au 1er lancement si des clés manquent. -->
    <div class="overlay" id="settings" hidden>
      <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <h2 class="settings-title" id="settingsTitle">Réglages</h2>
        <p class="settings-hint" id="settingsHint" hidden></p>

        <form class="settings-form" id="settingsForm">
          <label class="field">
            <span class="field-label">Clé API Unsplash <em>(Access Key)</em></span>
            <input class="field-input" id="key-unsplash" type="text" autocomplete="off" spellcheck="false" placeholder="Client-ID…" />
          </label>

          <label class="field">
            <span class="field-label">Clé API Pexels</span>
            <input class="field-input" id="key-pexels" type="text" autocomplete="off" spellcheck="false" placeholder="API Key…" />
          </label>

          <label class="field">
            <span class="field-label">Clé API Pixabay</span>
            <input class="field-input" id="key-pixabay" type="text" autocomplete="off" spellcheck="false" placeholder="API Key…" />
          </label>

          <p class="field-note">Openverse ne nécessite aucune clé (source anonyme).</p>

          <label class="field">
            <span class="field-label">Dossier de destination par défaut</span>
            <input class="field-input" id="dest" type="text" autocomplete="off" spellcheck="false" placeholder="D:\BRoll" />
          </label>

          <div class="settings-actions">
            <span class="settings-status" id="settingsStatus"></span>
            <button class="btn-secondary" id="closeSettings" type="button">Fermer</button>
            <button class="btn-primary" id="saveSettings" type="submit">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
