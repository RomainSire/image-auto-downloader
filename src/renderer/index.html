<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>B-Roll Downloader</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />

    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div id="app">
      <header class="app-header">
        <div class="app-brand">
          <img class="app-logo" src="./assets/broll-downloader.svg" alt="" width="44" height="44" />
          <h1 class="app-title">B-Roll Downloader</h1>
        </div>
        <p class="app-subtitle" data-i18n="app.subtitle">
          Royalty-free b-roll — Unsplash · Pexels · Pixabay
        </p>
        <button
          class="btn-secondary header-settings"
          id="openSettings"
          type="button"
          data-i18n="settings.button"
        >
          ⚙ Settings
        </button>
      </header>

      <main class="app-main">
        <section class="card">
          <p class="status" id="apiStatus" data-i18n="status.loading">Loading configuration…</p>

          <div class="media-toggle-row">
            <div class="media-group" id="mediaToggle" role="group" aria-label="Media type">
              <button
                class="media-btn is-active"
                type="button"
                data-media="photo"
                data-i18n="media.photos"
              >
                Photos
              </button>
              <button class="media-btn" type="button" data-media="video" data-i18n="media.videos">
                Videos
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="field">
              <span class="field-label" data-i18n="field.keyword">Search (keyword)</span>
              <input
                class="field-input"
                id="keyword"
                type="text"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="field.keyword.ph"
                placeholder="e.g. ramen, tokyo night, hands cooking…"
              />
            </label>
          </div>

          <div class="form-row form-row-split">
            <div class="field field-grow">
              <span class="field-label" data-i18n="field.destination">Destination folder</span>
              <div class="field-input-row">
                <input
                  class="field-input"
                  id="destFolder"
                  type="text"
                  autocomplete="off"
                  spellcheck="false"
                  data-i18n-placeholder="field.destination.ph"
                  placeholder="D:\BRoll"
                />
                <button
                  class="btn-secondary btn-browse"
                  id="browseDest"
                  type="button"
                  data-i18n="field.browse"
                >
                  Browse…
                </button>
              </div>
            </div>
            <label class="field field-grow">
              <span class="field-label" data-i18n="field.subfolder">Subfolder</span>
              <input
                class="field-input"
                id="subFolder"
                type="text"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="field.subfolder.ph"
                placeholder="2026-06-04-ramen"
              />
            </label>
          </div>

          <div class="sources">
            <div class="source-block" data-source="unsplash">
              <label class="source-toggle">
                <input class="source-enabled" type="checkbox" checked />
                <span class="source-name">Unsplash</span>
                <span class="source-tag" data-i18n="source.noVideo" hidden>No video</span>
              </label>
              <label class="source-count-field">
                <span class="source-count-label" data-i18n="source.count">Count</span>
                <input class="source-count" type="number" min="1" value="10" />
              </label>
              <span class="source-progress" data-state="idle">—</span>
              <p class="source-error" hidden></p>
            </div>

            <div class="source-block" data-source="pexels">
              <label class="source-toggle">
                <input class="source-enabled" type="checkbox" checked />
                <span class="source-name">Pexels</span>
                <span class="source-tag" data-i18n="source.noVideo" hidden>No video</span>
              </label>
              <label class="source-count-field">
                <span class="source-count-label" data-i18n="source.count">Count</span>
                <input class="source-count" type="number" min="1" value="10" />
              </label>
              <span class="source-progress" data-state="idle">—</span>
              <p class="source-error" hidden></p>
            </div>

            <div class="source-block" data-source="pixabay">
              <label class="source-toggle">
                <input class="source-enabled" type="checkbox" checked />
                <span class="source-name">Pixabay</span>
                <span class="source-tag" data-i18n="source.noVideo" hidden>No video</span>
              </label>
              <label class="source-count-field">
                <span class="source-count-label" data-i18n="source.count">Count</span>
                <input class="source-count" type="number" min="1" value="10" />
              </label>
              <span class="source-progress" data-state="idle">—</span>
              <p class="source-error" hidden></p>
            </div>
          </div>

          <div class="download-bar">
            <button class="btn-primary" id="downloadBtn" type="button" data-i18n="download.button">
              Download
            </button>
            <button
              class="btn-secondary"
              id="openFolderBtn"
              type="button"
              disabled
              data-i18n="download.openFolder"
            >
              Open folder
            </button>
            <span class="download-status" id="downloadStatus"></span>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <ul class="versions">
          <li class="electron-version"></li>
          <li class="chrome-version"></li>
          <li class="node-version"></li>
        </ul>
      </footer>
    </div>

    <!-- Panneau Réglages (overlay). Ouvert au 1er lancement si des clés manquent. -->
    <div class="overlay" id="settings" hidden>
      <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <h2 class="settings-title" id="settingsTitle" data-i18n="settings.title">Settings</h2>
        <p class="settings-hint" id="settingsHint" hidden></p>

        <form class="settings-form" id="settingsForm">
          <label class="field">
            <span class="field-label" data-i18n="settings.key.unsplash"
              >Unsplash API key (Access Key)</span
            >
            <input
              class="field-input"
              id="key-unsplash"
              type="text"
              autocomplete="off"
              spellcheck="false"
              data-i18n-placeholder="settings.key.ph.clientId"
              placeholder="Client-ID…"
            />
          </label>

          <label class="field">
            <span class="field-label" data-i18n="settings.key.pexels">Pexels API key</span>
            <input
              class="field-input"
              id="key-pexels"
              type="text"
              autocomplete="off"
              spellcheck="false"
              data-i18n-placeholder="settings.key.ph.apikey"
              placeholder="API Key…"
            />
          </label>

          <label class="field">
            <span class="field-label" data-i18n="settings.key.pixabay">Pixabay API key</span>
            <input
              class="field-input"
              id="key-pixabay"
              type="text"
              autocomplete="off"
              spellcheck="false"
              data-i18n-placeholder="settings.key.ph.apikey"
              placeholder="API Key…"
            />
          </label>

          <div class="field">
            <span class="field-label" data-i18n="settings.language">Language</span>
            <div class="lang-group" id="langGroup" role="group">
              <button class="lang-btn" type="button" data-lang="en">EN</button>
              <button class="lang-btn" type="button" data-lang="fr">FR</button>
              <button class="lang-btn" type="button" data-lang="ja">日本語</button>
            </div>
          </div>

          <div class="settings-actions">
            <span class="settings-status" id="settingsStatus"></span>
            <button
              class="btn-secondary"
              id="closeSettings"
              type="button"
              data-i18n="settings.close"
            >
              Close
            </button>
            <button class="btn-primary" id="saveSettings" type="submit" data-i18n="settings.save">
              Save
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
